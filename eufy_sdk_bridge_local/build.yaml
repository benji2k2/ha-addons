# Der Supervisor baut dieses Abbild selbst. Für ein Update:
#   1. BRIDGE_REF auf den neuen Commit von deploy/local setzen,
#   2. version in config.yaml hochzählen, pushen,
#   3. in HA die App aktualisieren (baut neu).
#
# build_from braucht einen Namensraum (library/…). Ein nackter Name wie node:24-alpine fällt
# durch die Prüfung des Supervisors, der dann die GANZE Datei ignoriert, samt args.
build_from:
  amd64: docker.io/library/node:24-alpine
  aarch64: docker.io/library/node:24-alpine
args:
  # Test Stream-Lebenszyklus (03.10.2026, mega-yfue/ha-eufy-sdk-bridge Issue 86): Fork benji2k2
  # fix/stream-lifecycle (968ffab) = offizielles dev (ac95e6d) + Fix. SDK aus dem Lockfile (0.2.0) wie beim
  # offiziellen Add-on 0.4.0, damit der Vergleich nur den Fix misst.
  # Voriger Stand (0.4.0-local.1, Sirenentest 30.09.): mega-yfue 497eb7d + SDK_DIST_TAG "0.4.0-beta.13".
  # Davor (0.3.0-local.4): Fork deploy/local c1c0e73 + Tarball sdk-hb3-test-1 (0.2.0-beta.25-hb3.1).
  BRIDGE_REPO: https://github.com/benji2k2/ha-eufy-sdk-bridge.git
  BRIDGE_REF: 968ffab6263f8f6468949bd67bc534b9366cb298
  # Leer = das im Lockfile festgelegte SDK, "beta" = neueste Beta von npm, sonst Version oder Tarball-URL.
  SDK_DIST_TAG: ""
  GO2RTC_VERSION: "1.9.9"
  # Diagnose: eingehende P2P-Pakete der Station loggen (siehe sdk-frame-log.mjs). Leer = aus.
  SDK_FRAME_LOG: ""
labels:
  org.opencontainers.image.source: "https://github.com/benji2k2/ha-addons"
